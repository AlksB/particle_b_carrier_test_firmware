# Fleet dashboard: Postgres + Grafana + the event ingest.
#
#   cp .env.example .env        # passwords, PARTICLE_TOKEN, path to the old log
#   docker compose up -d --build
#   docker compose run --rm ingest /data/particle_events.log   # load history, once
#   open http://localhost:3000  # admin / $GRAFANA_ADMIN_PASSWORD
#
# On a server, set DOMAIN in .env, point DNS at the box and add the https
# profile: Caddy terminates TLS on 80/443 and Grafana stays on localhost.
#
#   docker compose --profile https up -d --build
#
# `ingest` reads the live product event stream from api.particle.io and
# reconnects on its own. History from the SSE log is loaded with the `run`
# line above; inserts are idempotent, so the overlap between the log's end
# and the stream's start does not duplicate anything, and re-running the
# load is harmless. The :z on bind mounts is for SELinux hosts (Fedora/RHEL,
# podman); Docker elsewhere accepts and ignores it.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: fleet
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleet} -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 20
    # expose only if you want psql from the host:
    # ports: ["127.0.0.1:5432:5432"]

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fleet}:${POSTGRES_PASSWORD}@postgres:5432/fleet
      PARTICLE_TOKEN: ${PARTICLE_TOKEN:?set in .env}
      PARTICLE_PRODUCT_ID: ${PARTICLE_PRODUCT_ID:-44896}
    volumes:
      # old logs to backfill from, see the `run` line at the top
      - ${EVENT_LOG_DIR:-..}:/data:ro,z
    command: ["--stream"]

  grafana:
    image: grafana/grafana-oss:12.1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Docker punches its own holes in iptables, bypassing ufw: anything
      # published on 0.0.0.0 is reachable from the internet no matter what
      # the host firewall says. Behind Caddy, bind to loopback only.
      - "${GRAFANA_BIND:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z

  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [grafana]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}   # caddy refuses to start on an empty site address
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data

volumes:
  pgdata:
  grafana-data:
  caddy-data:
