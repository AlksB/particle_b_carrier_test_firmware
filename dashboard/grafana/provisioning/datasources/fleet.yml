apiVersion: 1
datasources:
  - name: Fleet
    uid: fleet-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: fleet
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: false
