name=test_LTE_BLE
#assetOtaDir=assets
# env.json pins the Cat-M1 band mask to 2/4/5/12/13 - the set the B404X is
# actually certified for (FCC ID XPYUBX19KM01, IC 8595A-UBX19KM01, North
# America only). This is a production setting, do not comment it out.
#
# It has to be set here because Device OS does not enforce it on this module,
# despite what the B404X datasheet claims ("bands not listed as certified are
# disabled in the Device OS operating system and cannot be enabled from user
# firmware"). In sara_ncp_client.cpp the certified-only mask is selected by a
# `legacy` flag that is set for SARA-R410 alone; the SARA-R510S in the B404X
# gets UBLOX_NCP_BANDMASK_1_64_R510 instead, which the source itself comments
# as "all default enabled" - all fourteen, European and Japanese bands
# included. Devices in the field confirm it: AT+UBANDMASK? answers
# 0,185473183,1048578 until this file overrides it.
#
# 0x181A is the same value Device OS applies to the R410 as its own default
# (UBLOX_NCP_BANDMASK_1_64_R410_LEGACY), so this is Particle's North American
# set, not one we invented. PREFERRED rather than FORBIDDEN on purpose: it
# replaces the whole 128-bit mask, which also clears bands 66 and 85 from the
# upper word - neither is certified, and a FORBIDDEN list would leave them on.
#
# Verify after flashing: AT+UBANDMASK? must answer 0,6170,0 (0x181A). The
# first connect after a change is ~33s longer than usual - Device OS writes
# the mask and resets the modem with AT+CFUN=16 once, then leaves it alone.
env=env.json
